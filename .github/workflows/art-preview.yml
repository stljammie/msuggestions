name: 4. Artwork preview

# Builds a page showing every poster, backdrop and logo option for the
# current picks, and saves it to the "art-preview" branch (kept off main so
# the large embedded images never bloat the site).

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['3. Build catalog']
    types: [completed]

permissions:
  contents: write

jobs:
  preview:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/art-preview.js
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - name: Save to art-preview branch
        run: |
          mkdir /tmp/out && cp art-preview/index.html /tmp/out/
          git config user.name "msuggestions-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan art-preview-tmp
          git rm -rq --cached .
          git clean -fdq
          cp /tmp/out/index.html .
          git add index.html
          git commit -qm "Artwork preview $(date -u +%Y-%m-%d)"
          git push -f origin HEAD:art-preview
