name: 3. Build catalog

on:
  schedule:
    - cron: '17 10 * * *' # nightly, about 3am Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/picks.json'
      - 'scripts/build-catalog.js'
      - 'scripts/lib/**'
      - 'scripts/build-site.js'

permissions:
  contents: write

concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-catalog.js
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          WATCHMODE_KEY: ${{ secrets.WATCHMODE_KEY }}
      - run: node scripts/build-site.js
      - name: Save catalog if it changed
        run: |
          git config user.name "msuggestions-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No changes to the site."
          else
            git commit -m "Update catalog $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do git pull --rebase && git push && break; sleep $((i * 5)); done
          fi
