name: 3. Build catalog

on:
  schedule:
    - cron: '17 10 * * *' # nightly, about 3am Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/picks.json'
      - 'scripts/build-catalog.js'
      - 'scripts/lib/**'

permissions:
  contents: write

concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-catalog.js
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - name: Save catalog if it changed
        run: |
          git config user.name "msuggestions-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/catalog.json
          if git diff --cached --quiet; then
            echo "No changes to the catalog."
          else
            git commit -m "Update catalog $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
