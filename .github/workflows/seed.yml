name: 5. Seed starter picks

# Replaces data/picks.json with real, currently free titles for every home
# page section, then rebuilds the site. Run only when you want fresh
# placeholders; it overwrites your picks.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REPLACE to overwrite data/picks.json'
        required: true

permissions:
  contents: write

jobs:
  seed:
    if: ${{ inputs.confirm == 'REPLACE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/seed-picks.js && node scripts/build-catalog.js && node scripts/build-site.js
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - name: Save
        run: |
          git config user.name "msuggestions-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/picks.json public
          git diff --cached --quiet || git commit -m "Seed starter picks"
          git pull --rebase && git push
